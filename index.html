<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arvia Sanat</title>
    <link rel="icon" type="image/webp" href="./src/resimler/resim-logo.webp" />
    <link rel="preload" as="image" href="/src/resimler/im3S.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/resimler/resim-logo.webp" type="image/webp" />
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{height:100%;margin:0;overflow-x:hidden}
      body{color:#2c2825;background:linear-gradient(160deg,#fdf9f5 0%,#f8f2eb 35%,#f5efe6 70%,#fdf9f5 100%);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans";line-height:1.55}
      .app{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
      .navbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(253,249,245,.92);border-bottom:1px solid rgba(107,95,84,.12)}
      .navbar-inner{display:flex;align-items:center;justify-content:space-between;max-width:1350px;margin:0 auto;padding:10px 16px}
      .navbar-logo{flex-shrink:0;width:100px;margin-left:40px}
      .navbar-logo-img{height:70px;width:auto;max-width:160px;object-fit:contain}
      .hero{padding:4px 0 16px}
      .hero-inner{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;min-height:min(500px,65vh);max-width:1350px;margin:0 auto;padding:12px 16px}
      .hero-left{flex:0 0 35%;max-width:380px}
      .hero-right{flex:0 0 65%;display:flex;justify-content:flex-end}
      .hero-slider{width:100%;max-width:800px;display:flex;flex-direction:column;gap:10px}
      .hero-slider-image-wrapper{position:relative;width:100%;height:min(480px,72vh);border-radius:16px;overflow:hidden;background:#f5efe6;border:1px solid rgba(107,95,84,.12)}
      .hero-slider-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
      .hero-slider-image.is-active{opacity:1;z-index:1}
      .hero-title{font-size:clamp(32px,3.2vw,40px);line-height:1.15;margin:0 0 16px}
      .hero-eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:600;color:#6b5f54;margin-bottom:10px}
      .container{width:100%;max-width:1350px;margin:0 auto;padding:12px 16px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
